# Production : images figées, plus de replicas, plus de ressources.
# Les secrets (postgres.password, jwt.secret) sont passés à part :
#   helm upgrade -f values.production.yaml -f secrets.production.yaml ...
# secrets.production.yaml est gitignored — voir secrets.production.yaml.example.
image:
  pullPolicy: Always

postgres:
  db: taskflow_prod
  storageSize: 10Gi

frontend:
  replicaCount: 2

userService:
  replicaCount: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

taskService:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

notificationService:
  replicaCount: 2

apiGateway:
  replicaCount: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

redis:
  enabled: true
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: false
  master:
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
